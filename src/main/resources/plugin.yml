name: GalacticVotes
main: me.eaz.galacticvotes.GalacticVotes
version: 1.0.0
api-version: 1.12
author: eaz
description: A complete voting plugin with NuVotifier support and vote-party integration with GalacticBosses.

depend:
  - Votifier

softdepend:
  - PlaceholderAPI
  - LuckPerms
  - GalacticBosses

commands:
  vote:
    description: Shows clickable vote links.
    usage: /vote
    permission: galacticvotes.vote
  votes:
    description: Shows your or another player's lifetime votes.
    usage: /votes [player]
    permission: galacticvotes.votes
  votetop:
    description: Shows the top lifetime voters.
    usage: /votetop
    permission: galacticvotes.votetop
  votemonth:
    description: Shows this month's top voters.
    usage: /votemonth
    permission: galacticvotes.votetop
  galacticvotes:
    description: Admin commands for GalacticVotes.
    usage: /galacticvotes <reload|resetmonth|voteparty|addvotes|setvotes|removevotes>
    permission: galacticvotes.admin

permissions:
  galacticvotes.vote:
    description: Allows use of /vote.
    default: true
  galacticvotes.votes:
    description: Allows use of /votes.
    default: true
  galacticvotes.votetop:
    description: Allows use of /votetop and /votemonth.
    default: true
  galacticvotes.admin:
    description: Grants access to admin commands.
    default: op
